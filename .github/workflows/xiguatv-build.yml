name: Build XiguaTV APK

on:
  workflow_dispatch:
  push:
    branches: [ xiguatv-build-ci ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: xiguatv
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp xiguatv/app/build/outputs/apk/debug/app-debug.apk XiguaTV-v0.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiguaTV-v0.2-debug
          path: XiguaTV-v0.2-debug.apk
          if-no-files-found: error
