name: Build XiguaTV APK

on:
  workflow_dispatch:
  push:
    branches: [ xiguatv-build-ci ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Recreate source archive
        run: |
          base64 -d xiguatv_source.zip.b64 > xiguatv_source.zip
          rm -rf _xiguatv_build
          mkdir -p _xiguatv_build
          unzip -q xiguatv_source.zip -d _xiguatv_build
          ls -la _xiguatv_build/XiguaTV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        working-directory: _xiguatv_build/XiguaTV
        run: python3 scripts/verify_project.py

      - name: Build debug APK
        working-directory: _xiguatv_build/XiguaTV
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp _xiguatv_build/XiguaTV/app/build/outputs/apk/debug/app-debug.apk XiguaTV-v0.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiguaTV-v0.2-debug
          path: XiguaTV-v0.2-debug.apk
          if-no-files-found: error
